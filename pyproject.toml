[project]
name = "quest-crt"
version = "0.2.0"
description = "Minimal standalone Quest XRHand, shoulder, and elbow pose streamer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiortc>=1.13.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.ruff]
line-length = 100

[project.scripts]
quest-crt = "quest_crt.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quest_crt"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "quest_crt/server.py"
"static" = "quest_crt/static"

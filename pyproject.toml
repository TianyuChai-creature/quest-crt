[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-crt"
version = "0.1.0"
description = "Minimal standalone Quest XRHand, shoulder, and elbow pose streamer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiortc>=1.13.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "pyzed",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
quest-crt-server = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["quest_crt*"]

[tool.setuptools.package-data]
quest_crt = ["static/*.html"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
pyzed = { url = "https://download.stereolabs.com/zedsdk/5.4/whl/linux_x86_64/pyzed-5.4-cp313-cp313-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

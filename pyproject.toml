[project]
name = "quest-xr-bridge"
version = "0.3.0"
description = "Embedded Quest pose SDK with independent generic RGB video return"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiortc>=1.13.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.ruff]
line-length = 100

[project.scripts]
quest-xr-bridge = "quest_xr_bridge.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quest_xr_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "quest_xr_bridge/static"
"patches/gstreamer-webrtc-dtls-owner.patch" = "quest_xr_bridge/patches/gstreamer-webrtc-dtls-owner.patch"
"examples/__init__.py" = "quest_xr_bridge/examples/__init__.py"
"examples/frozen_stereo.py" = "quest_xr_bridge/examples/frozen_stereo.py"
